name: Apply Final Completion Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-completion-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://wuxia-ai-dubbing.26nak-testdev.workers.dev
    steps:
      - uses: actions/checkout@v6

      - name: Apply completion, cleanup and merge fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, replacement, label, flags=re.S):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new, count = re.subn(pattern, lambda m: replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Patch target count {count}: {label} in {path}')
              p.write_text(new, encoding='utf-8')
              print('patched:', label)

          sub('src/storage.js',
              r"async function deletePrefix\(env, prefix\) \{.*?\n\}\n\nasync function storageInfo",
              '''async function deletePrefix(env, prefix, limit = null) {
            const files = await listAppFiles(env);
            const allMatches = files.filter(f => String(f.appProperties?.logicalKey || '').startsWith(prefix));
            const requested = Number(limit);
            const cap = Number.isFinite(requested) && requested > 0
              ? Math.min(40, Math.floor(requested))
              : allMatches.length;
            const matches = allMatches.slice(0, cap);
            let bytes = 0;
            for (const f of matches) {
              bytes += Number(f.size || 0);
              await driveFetch(env, `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(f.id)}`, { method: 'DELETE' });
            }
            return { bytes, count: matches.length, remaining: Math.max(0, allMatches.length - matches.length) };
          }

          async function storageInfo''', 'bounded deletePrefix')

          worker = Path('src/worker.js')
          text = worker.read_text(encoding='utf-8')
          if "core: 'clean-v2.2'" not in text:
              raise SystemExit('Worker core marker not found')
          worker.write_text(text.replace("core: 'clean-v2.2'", "core: 'clean-v2.3'", 1), encoding='utf-8')
          print('patched: core marker')

          sub('src/worker.js',
              r"  if \(p === '/api/internal/complete' && request\.method === 'POST'\) \{.*?\n  \}\n\n  if \(p === '/api/internal/fail'",
              '''  if (p === '/api/internal/complete' && request.method === 'POST') {
            const body = await request.json();
            const job = await readJob(env, body.jobId);
            if (!job) return json({ error: 'not found' }, 404);
            job.status = 'completed';
            job.pauseRequested = false;
            job.progress = 100;
            job.stage = 'เสร็จสมบูรณ์';
            job.outputKey = body.outputKey || job.outputKey;
            job.subtitleKey = body.subtitleKey || job.subtitleKey;
            job.duration = body.duration || job.duration;
            job.sizeBytes = body.sizeBytes || job.sizeBytes;
            job.error = null;
            job.cleanupPending = job.autoCleanup === true;
            await writeJob(env, job);
            return json({ ok: true, job, freedBytes: 0, cleanupPending: job.cleanupPending });
          }

          if (p === '/api/internal/cleanup-job' && request.method === 'POST') {
            const body = await request.json();
            const jobId = String(body.jobId || '');
            const kind = String(body.kind || '');
            if (!jobId || !['temp', 'state'].includes(kind)) return json({ error: 'invalid cleanup request' }, 400);
            const prefix = kind === 'temp' ? `temp/${jobId}/` : `_state/${jobId}/`;
            const result = await deletePrefix(env, prefix, 12);
            if (kind === 'state' && Number(result.remaining || 0) === 0) {
              const job = await readJob(env, jobId);
              if (job) {
                job.cleanupPending = false;
                await writeJob(env, job);
              }
            }
            return json({ ok: true, kind, ...result });
          }

          if (p === '/api/internal/fail' ''', 'complete before cleanup')

          p = Path('src/worker.js')
          text = p.read_text(encoding='utf-8')
          needle = "    if (job.sourceType === 'upload' && job.sourceKey) {\n      const src = await resolveLogical(env, job.sourceKey);"
          if needle not in text:
              raise SystemExit('retry source check not found')
          recovery = '''    if (action === 'retry') {
              const target = String(job.targetLang || 'th');
              const recoveredOutputKey = job.outputKey || `outputs/${job.id}/dub_${target}.mp4`;
              const recoveredOutput = await resolveLogical(env, recoveredOutputKey);
              if (recoveredOutput?.id && Number(recoveredOutput.size || 0) > 0) {
                job.status = 'completed';
                job.pauseRequested = false;
                job.progress = 100;
                job.stage = 'เสร็จสมบูรณ์';
                job.outputKey = recoveredOutputKey;
                job.sizeBytes = Number(recoveredOutput.size || 0);
                if (job.subtitles !== false) {
                  const recoveredSubtitleKey = `outputs/${job.id}/dub_${target}.srt`;
                  const recoveredSubtitle = await resolveLogical(env, recoveredSubtitleKey);
                  if (recoveredSubtitle?.id) job.subtitleKey = recoveredSubtitleKey;
                }
                job.error = null;
                job.cleanupPending = job.autoCleanup === true;
                await writeJob(env, job);
                return json({ ok: true, job, recovered: true });
              }
            }

          ''' + needle
          p.write_text(text.replace(needle, recovery, 1), encoding='utf-8')
          print('patched: retry recovery')

          sub('src/worker.js',
              r"    let freedBytes = 0;\n    let deleted = 0;\n    for \(const prefix of prefixes\) \{.*?\n    \}\n    return json\(\{ ok: true, kind, freedBytes, deleted \}\);",
              '''    let freedBytes = 0;
            let deleted = 0;
            let remaining = 0;
            const perPrefix = kind === 'all' ? 4 : kind === 'temp' ? 8 : 12;
            for (const prefix of prefixes) {
              const result = await deletePrefix(env, prefix, perPrefix);
              freedBytes += Number(result.bytes || 0);
              deleted += Number(result.count || 0);
              remaining += Number(result.remaining || 0);
            }
            return json({ ok: true, kind, freedBytes, deleted, remaining });''', 'batched public cleanup')

          p = Path('scripts/worker_client.py')
          text = p.read_text(encoding='utf-8')
          needle = '    def fail(self, job_id: str, error: str) -> dict[str, Any]:\n'
          if needle not in text:
              raise SystemExit('worker client fail method not found')
          method = '''    def cleanup_job(self, job_id: str, kind: str) -> dict[str, Any]:
              if kind not in {"temp", "state"}:
                  raise ValueError("cleanup kind must be temp or state")
              return self._json("POST", "/api/internal/cleanup-job", json={"jobId": job_id, "kind": kind})

          '''
          p.write_text(text.replace(needle, method + needle, 1), encoding='utf-8')
          print('patched: worker client cleanup')

          p = Path('scripts/finalize_job.py')
          text = p.read_text(encoding='utf-8')
          old = '        "-c", "copy",\n        "-avoid_negative_ts", "make_zero",'
          new = '        "-c", "copy",\n        "-bsf:a", "aac_adtstoasc",\n        "-avoid_negative_ts", "make_zero",'
          if old not in text:
              raise SystemExit('AAC copy target not found')
          text = text.replace(old, new, 1)
          old2 = '''    client.patch_job(job_id, status="processing", progress=99, stage="กำลังบันทึกผลลัพธ์")
            client.finish(job_id, output_key, subtitle_key, offset, size_bytes)
            print(json.dumps({'''
          # Normalize indentation in the search string because the file itself is
          # four spaces inside main().
          old2 = old2.replace('            client.finish', '    client.finish').replace('            print', '    print')
          new2 = '''    client.patch_job(job_id, status="processing", progress=99, stage="กำลังบันทึกผลลัพธ์")
            client.finish(job_id, output_key, subtitle_key, offset, size_bytes)

            if bool(job.get("autoCleanup", True)):
                for cleanup_kind in ("temp", "state"):
                    for _ in range(200):
                        try:
                            cleanup = client.cleanup_job(job_id, cleanup_kind)
                        except Exception as cleanup_error:
                            print(f"Cleanup warning ({cleanup_kind}): {cleanup_error}", flush=True)
                            break
                        if int(cleanup.get("remaining") or 0) <= 0:
                            break

            print(json.dumps({'''
          new2 = new2.replace('            client.finish', '    client.finish').replace('            if bool', '    if bool').replace('                for cleanup_kind', '        for cleanup_kind').replace('                    for _', '            for _').replace('                        try:', '                try:').replace('                            cleanup =', '                    cleanup =').replace('                        except Exception as cleanup_error:', '                except Exception as cleanup_error:').replace('                            print(f"Cleanup warning', '                    print(f"Cleanup warning').replace('                            break', '                    break').replace('                        if int(cleanup.get', '                if int(cleanup.get').replace('            print(json.dumps({', '    print(json.dumps({')
          if old2 not in text:
              raise SystemExit('finalizer finish target not found')
          p.write_text(text.replace(old2, new2, 1), encoding='utf-8')
          print('patched: finalizer merge and cleanup')

          p = Path('public/app.js')
          text = p.read_text(encoding='utf-8')
          old = '''        const result = await api(`/api/cleanup/${kind}`, { method: 'POST', body: '{}' });
                updateLoader(`ลบแล้ว คืนพื้นที่ ${fmtBytes(result.freedBytes)}`, 100);'''.replace('                updateLoader', '        updateLoader')
          new = '''        let totalFreed = 0;
                let result = { remaining: 1 };
                let round = 0;
                while (Number(result.remaining || 0) > 0 && round < 100) {
                  result = await api(`/api/cleanup/${kind}`, { method: 'POST', body: '{}' });
                  totalFreed += Number(result.freedBytes || 0);
                  round += 1;
                  if (Number(result.remaining || 0) > 0) {
                    updateLoader(`กำลังลบ${label} เหลือ ${result.remaining} รายการ`, Math.min(92, 35 + round * 6));
                  }
                }
                if (Number(result.remaining || 0) > 0) throw new Error('ยังลบไฟล์ไม่หมด กรุณากดลองอีกครั้ง');
                updateLoader(`ลบแล้ว คืนพื้นที่ ${fmtBytes(totalFreed)}`, 100);'''
          lines = new.splitlines()
          new = '\n'.join(('        ' + line.lstrip()) if i == 0 else line for i, line in enumerate(lines))
          # Use regex here to avoid indentation drift.
          pattern = r"        const result = await api\(`/api/cleanup/\$\{kind\}`, \{ method: 'POST', body: '\{\}' \}\);\n        updateLoader\(`ลบแล้ว คืนพื้นที่ \$\{fmtBytes\(result\.freedBytes\)\}`, 100\);"
          replacement = '''        let totalFreed = 0;
                let result = { remaining: 1 };
                let round = 0;
                while (Number(result.remaining || 0) > 0 && round < 100) {
                  result = await api(`/api/cleanup/${kind}`, { method: 'POST', body: '{}' });
                  totalFreed += Number(result.freedBytes || 0);
                  round += 1;
                  if (Number(result.remaining || 0) > 0) {
                    updateLoader(`กำลังลบ${label} เหลือ ${result.remaining} รายการ`, Math.min(92, 35 + round * 6));
                  }
                }
                if (Number(result.remaining || 0) > 0) throw new Error('ยังลบไฟล์ไม่หมด กรุณากดลองอีกครั้ง');
                updateLoader(`ลบแล้ว คืนพื้นที่ ${fmtBytes(totalFreed)}`, 100);'''
          replacement = '\n'.join(('        ' + x.lstrip()) if i == 0 else x for i, x in enumerate(replacement.splitlines()))
          new_text, count = re.subn(pattern, lambda m: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'app cleanup target count {count}')
          p.write_text(new_text, encoding='utf-8')
          print('patched: browser cleanup loop')

          p = Path('.github/workflows/deploy-cloudflare.yml')
          text = p.read_text(encoding='utf-8')
          if 'clean-v2.2' not in text:
              raise SystemExit('deploy core marker not found')
          p.write_text(text.replace('clean-v2.2', 'clean-v2.3'), encoding='utf-8')
          print('patched: deployment smoke core')
          PY

      - name: Validate syntax
        run: |
          node --check src/worker.js
          node --check src/storage.js
          node --check public/app.js
          python -m py_compile scripts/worker_client.py scripts/finalize_job.py scripts/prepare_job.py scripts/dub_chunk.py

      - name: Commit repaired core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/storage.js src/worker.js scripts/worker_client.py scripts/finalize_job.py public/app.js .github/workflows/deploy-cloudflare.yml
          git commit -m "Fix final completion and batched cleanup"
          git push origin main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Deploy repaired Worker
        run: |
          npm install
          npx wrangler deploy

      - name: Verify deployed core
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = os.environ['WORKER_URL'].rstrip('/')
          req = urllib.request.Request(base + '/api/health', headers={'User-Agent':'Mozilla/5.0 (Linux; Android 16; SM-S711B) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'})
          with urllib.request.urlopen(req, timeout=120) as r:
              health = json.load(r)
          assert health.get('core') == 'clean-v2.3', health
          assert health.get('driveReady') is True, health
          print('clean-v2.3 deployed: OK')
          PY
