name: Deploy Cloudflare Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check required GitHub Secrets
        env:
          ACCESS_KEY: ${{ secrets.WUXIA_ACCESS_KEY }}
          WORKER_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
          test -n "$ACCESS_KEY" || (echo 'Missing WUXIA_ACCESS_KEY' && exit 1)
          test -n "$WORKER_TOKEN" || (echo 'Missing WORKER_SHARED_TOKEN' && exit 1)
          test -n "$DISPATCH_TOKEN" || (echo 'Missing GH_DISPATCH_TOKEN' && exit 1)
          test -n "$GOOGLE_CLIENT_ID" || (echo 'Missing GOOGLE_CLIENT_ID' && exit 1)
          test -n "$GOOGLE_CLIENT_SECRET" || (echo 'Missing GOOGLE_CLIENT_SECRET' && exit 1)
          test -n "$GOOGLE_REFRESH_TOKEN" || (echo 'Missing GOOGLE_REFRESH_TOKEN' && exit 1)

      - name: Install Wrangler
        run: npm install

      - name: Deploy Worker + web assets
        run: npx wrangler deploy

      - name: Set private Worker secrets
        env:
          ACCESS_KEY: ${{ secrets.WUXIA_ACCESS_KEY }}
          WORKER_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          printf '%s' "$ACCESS_KEY" | npx wrangler secret put ACCESS_KEY
          printf '%s' "$WORKER_TOKEN" | npx wrangler secret put WORKER_SHARED_TOKEN
          printf '%s' "$DISPATCH_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          printf '%s' "$GOOGLE_REFRESH_TOKEN" | npx wrangler secret put GOOGLE_REFRESH_TOKEN

      - name: Smoke test mobile same-origin Base64 upload
        env:
          ACCESS_KEY: ${{ secrets.WUXIA_ACCESS_KEY }}
          WORKER_URL: https://wuxia-ai-dubbing.26nak-testdev.workers.dev
        run: |
          python - <<'PY'
          import base64, json, os, urllib.parse, urllib.request, urllib.error

          base = os.environ['WORKER_URL'].rstrip('/')
          access = os.environ['ACCESS_KEY']
          headers = {
              'x-access-key': access,
              'User-Agent': 'Mozilla/5.0 (Linux; Android 16; SM-S711B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Origin': base,
              'Sec-Fetch-Site': 'same-origin',
              'Sec-Fetch-Mode': 'cors',
              'Sec-CH-UA-Mobile': '?1',
          }

          def call(path, method='GET', body=None):
              h = dict(headers)
              data = body
              if isinstance(body, (dict, list)):
                  data = json.dumps(body).encode()
                  h['content-type'] = 'application/json'
              req = urllib.request.Request(base + path, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      raw = r.read().decode('utf-8', 'replace')
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode('utf-8', 'replace')
                  raise RuntimeError(f'{method} {path} -> HTTP {e.code}: {raw[:1200]}')

          _, health = call('/api/health')
          if not health.get('driveReady'):
              raise RuntimeError(f'Drive health failed: {health}')
          print('health: OK')

          part_size = 1024 * 1024
          size = part_size * 2 + 333333
          _, started = call('/api/uploads/start-safe', 'POST', {
              'name': '__deploy_mobile_safe__.bin',
              'size': size,
              'type': 'application/octet-stream',
          })
          if not started.get('safeUpload') or int(started.get('partSize', 0)) != part_size:
              raise RuntimeError(f'Safe mobile upload start failed: {started}')
          key = started['key']
          upload_id = started['uploadId']
          print('safe upload start: OK (1 MiB JSON chunks)')

          parts = []
          offset = 0
          part_number = 1
          while offset < size:
              length = min(part_size, size - offset)
              raw = bytes([64 + part_number]) * length
              payload = {
                  'key': key,
                  'uploadId': upload_id,
                  'partNumber': part_number,
                  'mimeType': 'application/octet-stream',
                  'data': base64.b64encode(raw).decode('ascii'),
              }
              _, result = call('/api/uploads/base64-part', 'POST', payload)
              if int(result.get('partNumber', -1)) != part_number:
                  raise RuntimeError(f'Chunk {part_number} not confirmed: {result}')
              parts.append({'partNumber': part_number, 'etag': result.get('etag')})
              print(f'safe Base64 chunk {part_number}: OK ({length} bytes decoded)')
              offset += length
              part_number += 1

          _, done = call('/api/uploads/complete', 'POST', {
              'key': key,
              'uploadId': upload_id,
              'parts': parts,
          })
          if int(done.get('size', -1)) != size:
              raise RuntimeError(f'Upload size mismatch: {done}')
          print('Drive final size verification: OK')

          dq = urllib.parse.urlencode({'key': key})
          _, deleted = call('/api/files?' + dq, 'DELETE')
          if not deleted.get('ok'):
              raise RuntimeError(f'Cleanup failed: {deleted}')
          print('cleanup: OK')
          PY

      - name: Deployment summary
        run: |
          echo '### Cloudflare + Google Drive backend deployed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Worker: `wuxia-ai-dubbing`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Mobile upload: same-origin Base64 JSON -> Worker -> Google Drive' >> "$GITHUB_STEP_SUMMARY"
          echo '- Mobile chunk: 1 MiB decoded; no browser-to-Google CORS and no raw binary browser POST' >> "$GITHUB_STEP_SUMMARY"
          echo '- Safe upload smoke test: 3 chunks + Drive size verification passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Desktop direct upload remains available' >> "$GITHUB_STEP_SUMMARY"
          echo '- Workers AI translation binding: `AI`' >> "$GITHUB_STEP_SUMMARY"
