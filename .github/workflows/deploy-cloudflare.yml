name: Deploy Cloudflare Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check required GitHub Secrets
        env:
          ACCESS_KEY: ${{ secrets.WUXIA_ACCESS_KEY }}
          WORKER_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
          test -n "$ACCESS_KEY" || (echo 'Missing WUXIA_ACCESS_KEY' && exit 1)
          test -n "$WORKER_TOKEN" || (echo 'Missing WORKER_SHARED_TOKEN' && exit 1)
          test -n "$DISPATCH_TOKEN" || (echo 'Missing GH_DISPATCH_TOKEN' && exit 1)
          test -n "$GOOGLE_CLIENT_ID" || (echo 'Missing GOOGLE_CLIENT_ID' && exit 1)
          test -n "$GOOGLE_CLIENT_SECRET" || (echo 'Missing GOOGLE_CLIENT_SECRET' && exit 1)
          test -n "$GOOGLE_REFRESH_TOKEN" || (echo 'Missing GOOGLE_REFRESH_TOKEN' && exit 1)

      - name: Install Wrangler
        run: npm install

      - name: Deploy Worker + web assets
        run: npx wrangler deploy

      - name: Set private Worker secrets
        env:
          ACCESS_KEY: ${{ secrets.WUXIA_ACCESS_KEY }}
          WORKER_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          printf '%s' "$ACCESS_KEY" | npx wrangler secret put ACCESS_KEY
          printf '%s' "$WORKER_TOKEN" | npx wrangler secret put WORKER_SHARED_TOKEN
          printf '%s' "$DISPATCH_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          printf '%s' "$GOOGLE_REFRESH_TOKEN" | npx wrangler secret put GOOGLE_REFRESH_TOKEN

      - name: Smoke test real-browser direct Google Drive resumable upload
        env:
          ACCESS_KEY: ${{ secrets.WUXIA_ACCESS_KEY }}
          WORKER_URL: https://wuxia-ai-dubbing.26nak-testdev.workers.dev
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          base = os.environ['WORKER_URL'].rstrip('/')
          access = os.environ['ACCESS_KEY']
          origin = base
          browser_headers = {
              'x-access-key': access,
              'User-Agent': 'Mozilla/5.0 (Linux; Android 16; SM-S711B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Origin': origin,
              'Sec-Fetch-Site': 'same-origin',
              'Sec-Fetch-Mode': 'cors',
              'Sec-CH-UA-Mobile': '?1',
          }

          def worker_call(path, method='GET', body=None):
              h = dict(browser_headers)
              data = body
              if isinstance(body, (dict, list)):
                  data = json.dumps(body).encode()
                  h['content-type'] = 'application/json'
              req = urllib.request.Request(base + path, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      raw = r.read().decode('utf-8', 'replace')
                      return r.status, dict(r.headers), json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode('utf-8', 'replace')
                  raise RuntimeError(f'{method} {path} -> HTTP {e.code}: {raw[:1200]}')

          def google_request(url, method='PUT', body=None, headers=None):
              h = dict(headers or {})
              req = urllib.request.Request(url, data=body, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return r.status, dict(r.headers), r.read()
              except urllib.error.HTTPError as e:
                  if e.code == 308:
                      return e.code, dict(e.headers), e.read()
                  raw = e.read().decode('utf-8', 'replace')
                  raise RuntimeError(f'Google {method} -> HTTP {e.code}: {raw[:1200]}')

          _, _, health = worker_call('/api/health')
          if not health.get('driveReady'):
              raise RuntimeError(f'Drive health failed: {health}')
          print('health: OK')

          size = 5 * 1024 * 1024
          _, _, started = worker_call('/api/uploads/start', 'POST', {
              'name': '__deploy_browser_direct__.bin',
              'size': size,
              'type': 'application/octet-stream',
          })
          if not started.get('directUpload') or not started.get('directSession'):
              raise RuntimeError(f'Direct browser upload was not enabled: {started}')
          if int(started.get('partSize', 0)) != 4 * 1024 * 1024:
              raise RuntimeError(f'Unexpected mobile direct partSize={started.get("partSize")}')
          key = started['key']
          upload_id = started['uploadId']
          session = started['directSession']
          print('browser start: OK (direct session, 4 MiB mobile chunk)')

          # Verify the browser CORS preflight that Content-Range PUT requires.
          status, cors, _ = google_request(session, 'OPTIONS', None, {
              'Origin': origin,
              'Access-Control-Request-Method': 'PUT',
              'Access-Control-Request-Headers': 'content-range,content-type',
          })
          allow_origin = cors.get('Access-Control-Allow-Origin') or cors.get('access-control-allow-origin')
          if status not in (200, 204) or allow_origin not in ('*', origin):
              raise RuntimeError(f'Google resumable CORS preflight failed: status={status}, allow-origin={allow_origin}, headers={cors}')
          print('Google resumable CORS preflight: OK')

          first_size = 4 * 1024 * 1024
          status, headers, _ = google_request(session, 'PUT', b'A' * first_size, {
              'Origin': origin,
              'Content-Type': 'application/octet-stream',
              'Content-Range': f'bytes 0-{first_size-1}/{size}',
          })
          if status != 308:
              raise RuntimeError(f'Expected 308 after first direct chunk, got {status}')
          print('direct Google chunk 1/2: OK')

          second_size = size - first_size
          status, headers, raw = google_request(session, 'PUT', b'B' * second_size, {
              'Origin': origin,
              'Content-Type': 'application/octet-stream',
              'Content-Range': f'bytes {first_size}-{size-1}/{size}',
          })
          if status not in (200, 201):
              raise RuntimeError(f'Expected final 200/201, got {status}: {raw[:500]!r}')
          print('direct Google chunk 2/2: OK')

          _, _, done = worker_call('/api/uploads/complete', 'POST', {
              'key': key,
              'uploadId': upload_id,
              'parts': [],
          })
          if int(done.get('size', -1)) != size:
              raise RuntimeError(f'Upload size mismatch: {done}')
          print('Worker verifies Drive file size: OK')

          dq = urllib.parse.urlencode({'key': key})
          _, _, deleted = worker_call('/api/files?' + dq, 'DELETE')
          if not deleted.get('ok'):
              raise RuntimeError(f'Cleanup failed: {deleted}')
          print('cleanup: OK')
          PY

      - name: Deployment summary
        run: |
          echo '### Cloudflare + Google Drive backend deployed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Worker: `wuxia-ai-dubbing`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser upload: Worker creates session, browser sends bytes directly to Google Drive' >> "$GITHUB_STEP_SUMMARY"
          echo '- Mobile chunk: 4 MiB; desktop chunk: 16 MiB' >> "$GITHUB_STEP_SUMMARY"
          echo '- Google resumable CORS preflight + direct 5 MiB / 2-chunk upload: tested' >> "$GITHUB_STEP_SUMMARY"
          echo '- Workers AI translation binding: `AI`' >> "$GITHUB_STEP_SUMMARY"
