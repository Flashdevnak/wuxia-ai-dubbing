name: Deploy Cloudflare Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check required GitHub Secrets
        env:
          ACCESS_KEY: ${{ secrets.WUXIA_ACCESS_KEY }}
          WORKER_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
          test -n "$ACCESS_KEY" || (echo 'Missing WUXIA_ACCESS_KEY' && exit 1)
          test -n "$WORKER_TOKEN" || (echo 'Missing WORKER_SHARED_TOKEN' && exit 1)
          test -n "$DISPATCH_TOKEN" || (echo 'Missing GH_DISPATCH_TOKEN' && exit 1)
          test -n "$GOOGLE_CLIENT_ID" || (echo 'Missing GOOGLE_CLIENT_ID' && exit 1)
          test -n "$GOOGLE_CLIENT_SECRET" || (echo 'Missing GOOGLE_CLIENT_SECRET' && exit 1)
          test -n "$GOOGLE_REFRESH_TOKEN" || (echo 'Missing GOOGLE_REFRESH_TOKEN' && exit 1)

      - name: Validate JavaScript and Python syntax
        run: |
          node --check public/app.js
          node --check src/worker.js
          node --check src/storage.js
          python -m py_compile scripts/dub_chunk.py scripts/prepare_job.py scripts/finalize_job.py scripts/worker_client.py

      - name: Install Wrangler
        run: npm install

      - name: Deploy backend and web assets
        run: npx wrangler deploy

      - name: Set private Worker secrets
        env:
          ACCESS_KEY: ${{ secrets.WUXIA_ACCESS_KEY }}
          WORKER_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          printf '%s' "$ACCESS_KEY" | npx wrangler secret put ACCESS_KEY
          printf '%s' "$WORKER_TOKEN" | npx wrangler secret put WORKER_SHARED_TOKEN
          printf '%s' "$DISPATCH_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          printf '%s' "$GOOGLE_REFRESH_TOKEN" | npx wrangler secret put GOOGLE_REFRESH_TOKEN

      - name: Smoke test storage uploads and translation
        env:
          ACCESS_KEY: ${{ secrets.WUXIA_ACCESS_KEY }}
          WORKER_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
          WORKER_URL: https://wuxia-ai-dubbing.26nak-testdev.workers.dev
        run: |
          python - <<'PY'
          import io, json, os, urllib.parse, urllib.request, urllib.error, uuid

          base = os.environ['WORKER_URL'].rstrip('/')
          access = os.environ['ACCESS_KEY']
          worker_token = os.environ['WORKER_TOKEN']
          browser_ua = 'Mozilla/5.0 (Linux; Android 16; SM-S711B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'

          def request(path, method='GET', body=None, headers=None, expect_json=True):
              h = {'User-Agent': browser_ua, 'Accept': '*/*', 'Accept-Language': 'th-TH,th;q=0.9,en-US;q=0.8,en;q=0.7'}
              h.update(headers or {})
              req = urllib.request.Request(base + path, data=body, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      raw = r.read()
                      if not expect_json:
                          return r.status, dict(r.headers), raw
                      return r.status, dict(r.headers), json.loads(raw.decode('utf-8')) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode('utf-8', 'replace')
                  raise RuntimeError(f'{method} {path} -> HTTP {e.code}: {raw[:1600]}')

          def public_json(path, method='GET', payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              headers = {'x-access-key': access, 'Accept': 'application/json'}
              if body is not None: headers['content-type'] = 'application/json'
              return request(path, method, body, headers)[2]

          def internal_json(path, method='GET', payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              headers = {'x-worker-token': worker_token, 'Accept': 'application/json'}
              if body is not None: headers['content-type'] = 'application/json'
              return request(path, method, body, headers)[2]

          def multipart_chunk(key, upload_id, part_number, chunk):
              boundary = '----wuxia' + uuid.uuid4().hex
              buf = io.BytesIO()
              def field(name, value):
                  buf.write(f'--{boundary}\r\n'.encode())
                  buf.write(f'Content-Disposition: form-data; name="{name}"\r\n\r\n'.encode())
                  buf.write(str(value).encode()); buf.write(b'\r\n')
              field('key', key); field('uploadId', upload_id); field('partNumber', part_number)
              buf.write(f'--{boundary}\r\n'.encode())
              buf.write(b'Content-Disposition: form-data; name="chunk"; filename="chunk.bin"\r\n')
              buf.write(b'Content-Type: application/octet-stream\r\n\r\n'); buf.write(chunk); buf.write(b'\r\n')
              buf.write(f'--{boundary}--\r\n'.encode())
              body = buf.getvalue()
              headers = {'x-access-key': access, 'content-type': f'multipart/form-data; boundary={boundary}', 'content-length': str(len(body)), 'Accept': 'application/json'}
              return request('/api/uploads/chunk', 'POST', body, headers)[2]

          health = request('/api/health')[2]
          assert health.get('driveReady'), health
          assert health.get('core') == 'clean-v2.3', health
          assert health.get('uploadMode') == 'same-origin-multipart', health
          print('health clean-v2.3: OK')

          translated = internal_json('/api/internal/translate', 'POST', {'texts': ['Hello, welcome.'], 'sourceLang': 'en', 'targetLang': 'th'})
          assert len(translated.get('translations') or []) == 1, translated
          assert str(translated['translations'][0]).strip(), translated
          print('translation: OK')

          part_size = 2 * 1024 * 1024
          source = b'A' * part_size + b'B' * part_size + b'C' * (1024 * 1024)
          started = public_json('/api/uploads/start', 'POST', {'name': '__core22_public_smoke__.bin', 'size': len(source), 'type': 'application/octet-stream'})
          assert int(started['partSize']) == part_size, started
          key, upload_id = started['key'], started['uploadId']
          for i in range(3):
              chunk = source[i * part_size:(i + 1) * part_size]
              result = multipart_chunk(key, upload_id, i + 1, chunk)
              assert int(result.get('partNumber', -1)) == i + 1, result
              if i == 0:
                  status = public_json('/api/uploads/status', 'POST', {'key': key, 'uploadId': upload_id})
                  assert int(status.get('nextOffset', -1)) == part_size, status
          done = public_json('/api/uploads/complete', 'POST', {'key': key, 'uploadId': upload_id})
          assert int(done.get('size', -1)) == len(source), done
          q = urllib.parse.urlencode({'key': key, 'access_key': access})
          downloaded = request('/api/files/download?' + q, expect_json=False)[2]
          assert downloaded == source
          public_json('/api/files?' + urllib.parse.urlencode({'key': key}), 'DELETE')
          print('public upload/resume/download: OK')

          internal_source = b'I' * (3 * 1024 * 1024)
          ikey = 'temp/__core22_internal_smoke__/known.bin'
          istart = internal_json('/api/internal/uploads/start', 'POST', {'key': ikey, 'size': len(internal_source), 'type': 'application/octet-stream'})
          iq = urllib.parse.urlencode({'key': ikey, 'uploadId': istart['uploadId'], 'partNumber': 1})
          request('/api/internal/uploads/part?' + iq, 'PUT', internal_source, {'x-worker-token': worker_token, 'content-type': 'application/octet-stream', 'content-length': str(len(internal_source))})
          idone = internal_json('/api/internal/uploads/complete', 'POST', {'key': ikey, 'uploadId': istart['uploadId'], 'parts': []})
          assert int(idone.get('size', -1)) == len(internal_source), idone
          idata = request('/api/internal/file?' + urllib.parse.urlencode({'key': ikey}), headers={'x-worker-token': worker_token}, expect_json=False)[2]
          assert idata == internal_source
          public_json('/api/files?' + urllib.parse.urlencode({'key': ikey}), 'DELETE')
          print('internal known-size upload: OK')

          stream_source = b'S' * (1024 * 1024 + 777)
          skey = 'temp/__core22_internal_smoke__/stream.bin'
          sstart = internal_json('/api/internal/uploads/start', 'POST', {'key': skey, 'type': 'application/octet-stream'})
          sq = urllib.parse.urlencode({'key': skey, 'uploadId': sstart['uploadId'], 'partNumber': 1, 'finalTotal': len(stream_source)})
          request('/api/internal/uploads/part?' + sq, 'PUT', stream_source, {'x-worker-token': worker_token, 'content-type': 'application/octet-stream', 'content-length': str(len(stream_source))})
          sdone = internal_json('/api/internal/uploads/complete', 'POST', {'key': skey, 'uploadId': sstart['uploadId'], 'parts': []})
          assert int(sdone.get('size', -1)) == len(stream_source), sdone
          public_json('/api/files?' + urllib.parse.urlencode({'key': skey}), 'DELETE')
          print('internal streaming upload: OK')
          PY

      - name: Deployment summary
        run: |
          echo '### Backend deployment passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Job pause, resume and retry controls enabled' >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser resumable upload enabled' >> "$GITHUB_STEP_SUMMARY"
          echo '- Translation smoke test passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Google Drive upload smoke tests passed' >> "$GITHUB_STEP_SUMMARY"
