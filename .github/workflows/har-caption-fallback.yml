name: Apply HAR Caption Fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/har-caption-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Apply HAR fallback patch
        run: python scripts/apply_har_caption_fallback.py

      - name: Validate source
        run: |
          node --check public/app.js
          node --check src/worker.js
          node --check src/youtube.js
          python -m py_compile scripts/prepare_job.py scripts/extract_transcript_job.py scripts/youtube_transcript.py scripts/dub_chunk.py scripts/finalize_job.py
          grep -q 'id="harInput"' public/index.html
          grep -q 'captionUrl' public/app.js
          grep -q 'extract_signed_youtube_transcript' scripts/youtube_transcript.py

      - name: Unit check signed caption parser
        run: |
          python - <<'PY'
          import scripts.youtube_transcript as y
          original = y._http_get
          y._http_get = lambda *args, **kwargs: '<transcript><text start="1.25" dur="2.5">ทดสอบ</text></transcript>'.encode('utf-8')
          try:
              data = y.extract_signed_youtube_transcript(
                  'https://www.youtube.com/api/timedtext?v=Q3Ff-OExkB0&lang=th&fmt=srv1&signature=test',
                  target_lang='th',
                  expected_video_url='https://www.youtube.com/watch?v=Q3Ff-OExkB0',
              )
              assert data['targetReady'] is True
              assert len(data['entries']) == 1
              assert data['entries'][0]['text'] == 'ทดสอบ'
              print({'signedParser': 'ok', 'lines': len(data['entries']), 'language': data['language']})
          finally:
              y._http_get = original
          PY

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add browser HAR subtitle fallback"
          git push origin main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Deploy Worker and web assets
        run: |
          npm install
          npx wrangler deploy

      - name: Verify deployed health
        run: |
          python - <<'PY'
          import json, urllib.request
          url = 'https://wuxia-ai-dubbing.26nak-testdev.workers.dev/api/health'
          with urllib.request.urlopen(url, timeout=30) as r:
              data = json.load(r)
          assert data.get('ok') is True, data
          assert data.get('driveReady') is True, data
          print({'ok': data.get('ok'), 'core': data.get('core'), 'driveReady': data.get('driveReady')})
          PY
