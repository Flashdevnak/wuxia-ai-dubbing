name: R3 Smart Dubbing Acceptance

on:
  pull_request:
    paths:
      - 'scripts/r3_studio.py'
      - 'scripts/test_r3_studio.py'
      - 'scripts/test_r3_runtime.py'
      - 'scripts/dub_guard.py'
      - 'src/worker-r3.js'
      - 'public/r3-studio.js'
      - 'public/r3-studio.css'
      - 'wrangler.jsonc'
      - '.github/workflows/r3-acceptance.yml'
  push:
    branches: [main, codex/r3-runtime-integration]
    paths:
      - 'scripts/r3_studio.py'
      - 'scripts/test_r3_studio.py'
      - 'scripts/test_r3_runtime.py'
      - 'scripts/dub_guard.py'
      - 'src/worker-r3.js'
      - 'public/r3-studio.js'
      - 'public/r3-studio.css'
      - 'wrangler.jsonc'
      - '.github/workflows/r3-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Compile R3 engine and runtime guard
        run: python -m py_compile scripts/r3_studio.py scripts/test_r3_studio.py scripts/test_r3_runtime.py scripts/dub_guard.py
      - name: Check R3 JavaScript syntax
        run: |
          node --check src/worker-r3.js
          node --check public/r3-studio.js
      - name: Run R3 engine acceptance
        working-directory: scripts
        run: python test_r3_studio.py
      - name: Run R3 runtime acceptance
        run: python scripts/test_r3_runtime.py
