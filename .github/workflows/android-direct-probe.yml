name: Probe Android InnerTube Direct

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-direct-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Android player and captions
        run: |
          python - <<'PY'
          import json, requests
          from urllib.parse import urlparse, parse_qsl, urlencode, urlunparse

          video_id = 'Q3Ff-OExkB0'
          key = 'AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8'
          ua = 'com.google.android.youtube/20.10.38 (Linux; U; Android 14) gzip'
          payload = {
              'context': {'client': {
                  'hl': 'en', 'gl': 'US', 'clientName': 'ANDROID',
                  'clientVersion': '20.10.38', 'androidSdkVersion': 34,
                  'userAgent': ua,
              }},
              'videoId': video_id,
              'contentCheckOk': True,
              'racyCheckOk': True,
          }
          r = requests.post(
              f'https://www.youtube.com/youtubei/v1/player?key={key}&prettyPrint=false',
              headers={
                  'Content-Type':'application/json', 'User-Agent':ua,
                  'X-YouTube-Client-Name':'3', 'X-YouTube-Client-Version':'20.10.38'
              },
              json=payload, timeout=30,
          )
          print('player_http', r.status_code)
          data = r.json() if r.ok else {}
          ps = data.get('playabilityStatus') or {}
          print('playability', ps.get('status'), ps.get('reason'))
          renderer = (((data.get('captions') or {}).get('playerCaptionsTracklistRenderer')) or {})
          tracks = renderer.get('captionTracks') or []
          translations = renderer.get('translationLanguages') or []
          print('caption_tracks', len(tracks), 'translations', len(translations))
          print('languages', [x.get('languageCode') for x in tracks[:20]])
          assert tracks, 'Android player returned no caption tracks'

          target = next((x for x in tracks if (x.get('languageCode') or '').split('-')[0] == 'th'), None)
          source = target or tracks[0]
          base = source['baseUrl']
          u = urlparse(base)
          q = dict(parse_qsl(u.query, keep_blank_values=True))
          q['fmt'] = 'srv1'
          if target is None:
              q['tlang'] = 'th'
          cap_url = urlunparse((u.scheme,u.netloc,u.path,u.params,urlencode(q),u.fragment))
          c = requests.get(cap_url, timeout=30)
          print('caption_http', c.status_code, 'bytes', len(c.content), 'content_type', c.headers.get('content-type'))
          print('has_transcript', '<text ' in c.text or '<p ' in c.text)
          assert c.ok and len(c.content) > 100, 'caption body unavailable'
          PY
