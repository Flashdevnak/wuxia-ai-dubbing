name: Apply Transcript First Upgrade

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-transcript-first.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://wuxia-ai-dubbing.26nak-testdev.workers.dev
    steps:
      - uses: actions/checkout@v6

      - name: Apply transcript-first source patch
        run: python scripts/apply_transcript_first_patch.py

      - name: Validate source syntax
        run: |
          node --check src/worker.js
          node --check public/app.js
          python -m py_compile scripts/youtube_transcript.py scripts/prepare_job.py scripts/dub_chunk.py scripts/worker_client.py scripts/finalize_job.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prepare_job.py scripts/dub_chunk.py scripts/worker_client.py src/worker.js public/app.js
          git commit -m "Use YouTube transcripts for timed dubbing"
          git push origin main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Deploy upgraded Worker
        run: |
          npm install
          npx wrangler deploy

      - name: Verify deployed service
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(os.environ['WORKER_URL'] + '/api/health', headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=120) as r:
              health = json.load(r)
          assert health.get('driveReady') is True, health
          print('Transcript-first Worker deployed: OK')
          PY
