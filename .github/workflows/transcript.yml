name: YouTube Transcript

on:
  repository_dispatch:
    types: [transcript_job]

permissions:
  contents: read

jobs:
  transcript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKER_URL: ${{ github.event.client_payload.workerBase || secrets.WORKER_URL }}
      WORKER_SHARED_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
      JOB_JSON: ${{ toJson(github.event.client_payload.job) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install transcript tools
        run: python -m pip install --disable-pip-version-check "yt-dlp>=2026.8.0" "requests>=2.32,<3" "srt>=3.5.3,<4"

      - name: Save job payload
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path('job.json').write_text(os.environ['JOB_JSON'], encoding='utf-8')
          PY

      - name: Register workflow run
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from worker_client import WorkerClient
          job = json.loads(os.environ['JOB_JSON'])
          client = WorkerClient(os.environ['WORKER_URL'], os.environ['WORKER_SHARED_TOKEN'])
          current = client.patch_job(
              job['id'],
              runId=int(os.environ['GITHUB_RUN_ID']),
              runAttempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
              status='processing',
              progress=8,
              stage='กำลังเริ่มดึงคำบรรยายจาก YouTube',
          )
          print(json.dumps({'id': current.get('id'), 'status': current.get('status'), 'progress': current.get('progress')}, ensure_ascii=False))
          PY

      - name: Extract and translate timed transcript
        run: python scripts/extract_transcript_job.py --job job.json --worker-url "$WORKER_URL" --token "$WORKER_SHARED_TOKEN"

      - name: Mark transcript job failed
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from worker_client import WorkerClient
          job = json.loads(os.environ['JOB_JSON'])
          client = WorkerClient(os.environ['WORKER_URL'], os.environ['WORKER_SHARED_TOKEN'])
          try:
              current = client.get_job(job['id'])
          except Exception:
              current = {}
          if current.get('status') in {'completed', 'paused'}:
              raise SystemExit(0)
          if not current.get('error'):
              client.fail(job['id'], 'ดึงคำบรรยาย YouTube ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง')
          PY
