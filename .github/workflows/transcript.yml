name: YouTube Transcript

on:
  repository_dispatch:
    types: [transcript_job]

permissions:
  contents: read

jobs:
  transcript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKER_URL: ${{ github.event.client_payload.workerBase }}
      WORKER_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install transcript tools
        run: python -m pip install --disable-pip-version-check "yt-dlp>=2026.8.0" "requests>=2.32,<3" "srt>=3.5.3,<4"

      - name: Save job payload
        env:
          JOB_JSON: ${{ toJson(github.event.client_payload.job) }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path('job.json').write_text(os.environ['JOB_JSON'], encoding='utf-8')
          PY

      - name: Register workflow run
        env:
          JOB_ID: ${{ github.event.client_payload.job.id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = os.environ['WORKER_URL'].rstrip('/') + '/api/internal/jobs/' + os.environ['JOB_ID']
          body = json.dumps({'runId': int(os.environ['GITHUB_RUN_ID']), 'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT'])}).encode()
          req = urllib.request.Request(url, data=body, method='PATCH', headers={'x-worker-token': os.environ['WORKER_TOKEN'], 'content-type': 'application/json'})
          with urllib.request.urlopen(req, timeout=60) as r:
              print(r.read().decode())
          PY

      - name: Extract and translate timed transcript
        run: python scripts/extract_transcript_job.py --job job.json --worker-url "$WORKER_URL" --token "$WORKER_TOKEN"
