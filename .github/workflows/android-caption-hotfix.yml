name: Apply Android Caption Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-caption-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://wuxia-ai-dubbing.26nak-testdev.workers.dev
      WORKER_SHARED_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Apply Android InnerTube patch
        run: python scripts/apply_android_caption_patch.py

      - name: Validate source
        run: node --check src/youtube.js

      - name: Commit permanent source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/youtube.js
          git diff --cached --quiet || git commit -m "Use Android InnerTube for YouTube captions"
          git push origin main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Deploy Worker
        run: |
          npm install
          npx wrangler deploy

      - name: Probe exact user video
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from worker_client import WorkerClient
          client = WorkerClient(os.environ['WORKER_URL'], os.environ['WORKER_SHARED_TOKEN'])
          data = client.youtube_transcript('https://www.youtube.com/watch?v=Q3Ff-OExkB0', target_lang='th', source_lang='auto')
          entries = data.get('entries') or []
          assert len(entries) >= 50, data
          print({'origin': data.get('origin'), 'language': data.get('language'), 'targetReady': data.get('targetReady'), 'lines': len(entries), 'first': entries[0]})
          PY
