name: AI Dubbing Pipeline

on:
  repository_dispatch:
    types: [dubbing_job]

permissions:
  contents: read

concurrency:
  group: dubbing-${{ github.event.client_payload.job.id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      total: ${{ steps.prepare.outputs.total }}
      duration: ${{ steps.prepare.outputs.duration }}
      paused: ${{ steps.control.outputs.paused }}
    env:
      WORKER_URL: ${{ github.event.client_payload.workerBase || secrets.WORKER_URL }}
      WORKER_SHARED_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
      JOB_JSON: ${{ toJson(github.event.client_payload.job) }}
      CHUNK_SECONDS: ${{ github.event.client_payload.job.processingMode == 'quality' && '600' || github.event.client_payload.job.processingMode == 'balanced' && '420' || '300' }}
    steps:
      - uses: actions/checkout@v6
      - id: control
        name: Register running job and read pause state
        run: |
          JOB_ID="$(python3 -c 'import json,os; print(json.loads(os.environ["JOB_JSON"])["id"])')"
          RESPONSE="$(curl --fail --silent --show-error \
            -X PATCH "$WORKER_URL/api/internal/jobs/$JOB_ID" \
            -H "x-worker-token: $WORKER_SHARED_TOKEN" \
            -H "content-type: application/json" \
            --data "{\"runId\":$GITHUB_RUN_ID,\"runAttempt\":$GITHUB_RUN_ATTEMPT}")"
          PAUSED="$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; j=json.load(sys.stdin).get("job",{}); print("true" if j.get("pauseRequested") or j.get("status")=="paused" else "false")')"
          echo "paused=$PAUSED" >> "$GITHUB_OUTPUT"
          if [ "$PAUSED" = "true" ]; then
            echo "Job is paused before preparation"
          fi
      - uses: actions/setup-python@v6
        if: ${{ steps.control.outputs.paused != 'true' }}
        with:
          python-version: '3.12'
          cache: pip
      - name: Ensure ffmpeg
        if: ${{ steps.control.outputs.paused != 'true' }}
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Install preparation dependencies
        if: ${{ steps.control.outputs.paused != 'true' }}
        run: pip install requests yt-dlp
      - name: Write job payload
        if: ${{ steps.control.outputs.paused != 'true' }}
        run: |
          python - <<'PY'
          import os, pathlib
          pathlib.Path('job.json').write_text(os.environ['JOB_JSON'], encoding='utf-8')
          PY
      - id: prepare
        name: Prepare video chunks
        if: ${{ steps.control.outputs.paused != 'true' }}
        run: |
          python scripts/prepare_job.py \
            --job job.json \
            --worker-url "$WORKER_URL" \
            --token "$WORKER_SHARED_TOKEN" \
            --chunk-seconds "$CHUNK_SECONDS" \
            --github-output "$GITHUB_OUTPUT"

  dub:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.paused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      WORKER_URL: ${{ github.event.client_payload.workerBase || secrets.WORKER_URL }}
      WORKER_SHARED_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
      JOB_JSON: ${{ toJson(github.event.client_payload.job) }}
      WHISPER_MODEL: ${{ github.event.client_payload.job.processingMode == 'fast' && 'base' || 'small' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Ensure ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}-${{ runner.os }}-v2
          restore-keys: |
            whisper-${{ env.WHISPER_MODEL }}-${{ runner.os }}-
      - name: Install dubbing dependencies
        run: pip install -r requirements.txt
      - name: Write job payload
        run: |
          python - <<'PY'
          import os, pathlib
          pathlib.Path('job.json').write_text(os.environ['JOB_JSON'], encoding='utf-8')
          PY
      - name: Dub chunk ${{ matrix.index }}
        run: |
          python scripts/dub_chunk.py \
            --job job.json \
            --worker-url "$WORKER_URL" \
            --token "$WORKER_SHARED_TOKEN" \
            --index '${{ matrix.index }}' \
            --key '${{ matrix.key }}' \
            --total '${{ matrix.total }}'

  finalize:
    needs: [prepare, dub]
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.paused != 'true' && needs.dub.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      WORKER_URL: ${{ github.event.client_payload.workerBase || secrets.WORKER_URL }}
      WORKER_SHARED_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
      JOB_JSON: ${{ toJson(github.event.client_payload.job) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Ensure ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Install finalizer dependencies
        run: pip install requests srt
      - name: Write job payload
        run: |
          python - <<'PY'
          import os, pathlib
          pathlib.Path('job.json').write_text(os.environ['JOB_JSON'], encoding='utf-8')
          PY
      - name: Combine and upload final MP4
        run: |
          python scripts/finalize_job.py \
            --job job.json \
            --worker-url "$WORKER_URL" \
            --token "$WORKER_SHARED_TOKEN" \
            --total '${{ needs.prepare.outputs.total }}'

  mark-failed:
    needs: [prepare, dub, finalize]
    if: ${{ always() && (needs.prepare.result == 'failure' || needs.dub.result == 'failure' || needs.finalize.result == 'failure') }}
    runs-on: ubuntu-latest
    env:
      WORKER_URL: ${{ github.event.client_payload.workerBase || secrets.WORKER_URL }}
      WORKER_SHARED_TOKEN: ${{ secrets.WORKER_SHARED_TOKEN }}
      JOB_JSON: ${{ toJson(github.event.client_payload.job) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Mark job failed
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from worker_client import WorkerClient
          job = json.loads(os.environ['JOB_JSON'])
          client = WorkerClient(os.environ['WORKER_URL'], os.environ['WORKER_SHARED_TOKEN'])
          current = client.get_job(job['id'])
          if current.get('pauseRequested') or current.get('status') == 'paused':
              print('Job is paused; failure state will not overwrite it')
              raise SystemExit(0)
          if not current.get('error'):
              client.fail(job['id'], 'ขั้นประมวลผลเสียงพากย์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง')
          PY
