name: Storage Efficiency Acceptance

on:
  pull_request:
    paths:
      - 'scripts/prepare_job_full.py'
      - 'scripts/media_pair.py'
      - 'scripts/test_media_pair.py'
      - 'src/worker-stability.js'
      - '.github/workflows/storage-efficiency.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_job_full.py'
      - 'scripts/media_pair.py'
      - 'scripts/test_media_pair.py'
      - 'src/worker-stability.js'
      - '.github/workflows/storage-efficiency.yml'
  workflow_dispatch:

jobs:
  storage-efficiency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Syntax checks
        run: |
          python -m py_compile scripts/prepare_job_full.py scripts/media_pair.py scripts/test_media_pair.py
          node --check src/worker-stability.js

      - name: Direct separate-audio storage contract
        run: |
          grep -q 'DIRECT_PAIR_MODE = "direct-separate-audio-v2"' scripts/media_pair.py
          grep -q 'DIRECT_PAIR_CONTRACT_VERSION = 2' scripts/media_pair.py
          grep -q 'direct_pair_manifest_compatible' scripts/prepare_job_full.py
          grep -q 'audioMuxed' scripts/prepare_job_full.py
          grep -q 'STORAGE_EFFICIENT_DIRECT_PAIR_PASS' scripts/prepare_job_full.py
          grep -q 'do not create temp/{job}/paired_source.mkv' scripts/prepare_job_full.py
          if grep -q 'mux_separate_audio' scripts/prepare_job_full.py; then
            echo 'prepare_job_full.py still imports or calls full-file muxing' >&2
            exit 1
          fi
          if grep -q 'client.upload(paired_local' scripts/prepare_job_full.py; then
            echo 'prepare_job_full.py still uploads a full paired media copy' >&2
            exit 1
          fi

      - name: Late-stage recovery contract
        run: |
          grep -q 'recoveredWithoutOriginals' scripts/prepare_job_full.py
          grep -q 'Recovering direct-pair job from' scripts/prepare_job_full.py
          grep -q '_recover_completed_dub_chunks' scripts/prepare_job_full.py

      - name: Peak storage compaction contract
        run: |
          grep -q 'STORAGE_COMPACTION_VERSION = 2' src/worker-stability.js
          grep -q 'active-storage-compaction' src/worker-stability.js
          grep -q 'source-release' src/worker-stability.js
          grep -q 'all-dub-chunks-durable' src/worker-stability.js
          grep -q 'releaseCompletedSourceChunks: true' src/worker-stability.js
          grep -q 'releaseOriginalsAfterAllDubChunks: true' src/worker-stability.js
          grep -q 'releaseOriginalsAfterCompletion: true' src/worker-stability.js
          grep -q 'temp/${jobId}/paired_source.mkv' src/worker-stability.js
          grep -q 'temp/${jobId}/source/chunk_${n}.mkv' src/worker-stability.js
          grep -q 'temp/${jobId}/transcript/chunk_${n}.json' src/worker-stability.js
          echo 'STORAGE_EFFICIENCY_ACCEPTANCE_PASS'
