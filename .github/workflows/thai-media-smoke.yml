name: Thai Media Smoke

on:
  pull_request:
    paths:
      - 'scripts/dub_chunk.py'
      - 'scripts/dub_guard.py'
      - 'scripts/voice_profiles.py'
      - 'requirements.txt'
      - '.github/workflows/dubbing.yml'
      - '.github/workflows/thai-media-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thai-media-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ffmpeg and Thai font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
          ffmpeg -version | head -n 1
          fc-match "Noto Sans Thai" | head -n 1

      - name: Install lightweight TTS smoke dependencies
        run: python -m pip install --disable-pip-version-check "edge-tts>=7.2.0,<8"

      - name: Generate real Thai voice-profile samples and recovery cases
        run: |
          python - <<'PY'
          import asyncio
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import voice_profiles
          from voice_profiles import list_profile_voices, synthesize_profile, decode_profile

          LOCALES = {'th': 'th-TH'}

          async def main():
              wanted = ['child-girl', 'teen-boy', 'adult-female', 'elder-male', 'narrator']
              selected = {}
              for profile_name in wanted:
                  voices = await list_profile_voices('th', profile_name, LOCALES)
                  if not voices:
                      raise RuntimeError(f'No profile voice: {profile_name}')
                  selected[profile_name] = voices[0]
                  profile = decode_profile(voices[0])
                  if not profile or not profile.get('voice'):
                      raise RuntimeError(f'Invalid profile encoding: {profile_name}')
                  print(profile_name, profile)
                  out = Path(f'{profile_name}.mp3')
                  await synthesize_profile(
                      'ทดสอบระบบพากย์ไทยหลายช่วงวัย เสียงชัดเจนและทำงานอัตโนมัติ',
                      voices[0],
                      out,
                  )
                  if not out.exists() or out.stat().st_size <= 0:
                      raise RuntimeError(f'Empty TTS output: {profile_name}')

              # Punctuation-only Whisper/translation segments are not dialogue.
              # They must become valid silence instead of failing the whole job.
              punctuation = Path('punctuation-only.mp3')
              await synthesize_profile('… — !!!', selected['adult-female'], punctuation)
              if not punctuation.exists() or punctuation.stat().st_size <= 0:
                  raise RuntimeError('Punctuation-only silence fallback failed')

              # Reproduce the exact production failure class deterministically:
              # the chosen styled profile returns no audio, but neutral settings
              # on the same voice succeed. Recovery must happen automatically.
              real_communicate = voice_profiles.edge_tts.Communicate
              calls = []

              class FakeCommunicate:
                  def __init__(self, *, text, voice, rate, pitch, volume):
                      self.text = text
                      self.voice = voice
                      self.rate = rate
                      self.pitch = pitch
                      self.volume = volume
                      calls.append((voice, rate, pitch, volume))

                  async def save(self, destination):
                      if self.rate != '+0%' or self.pitch != '+0Hz':
                          raise RuntimeError('No audio was received. Please verify that your parameters are correct.')
                      Path(destination).write_bytes(b'deterministic-recovery-ok')

              try:
                  voice_profiles.edge_tts.Communicate = FakeCommunicate
                  recovered = Path('deterministic-recovery.mp3')
                  await synthesize_profile(
                      'ทดสอบการกู้เสียงเมื่อ Edge ไม่คืนข้อมูลเสียง',
                      selected['elder-male'],
                      recovered,
                  )
                  if not recovered.exists() or recovered.stat().st_size <= 0:
                      raise RuntimeError('Deterministic recovery did not produce output')
                  if not any(rate == '+0%' and pitch == '+0Hz' for _, rate, pitch, _ in calls):
                      raise RuntimeError(f'Neutral fallback was not attempted: {calls}')
                  print('deterministic no-audio recovery: OK', calls)
              finally:
                  voice_profiles.edge_tts.Communicate = real_communicate

          asyncio.run(main())
          PY

      - name: Render Thai subtitle and mix audio
        run: |
          cat > thai-smoke.srt <<'EOF'
          1
          00:00:00,200 --> 00:00:03,800
          ทดสอบระบบพากย์ไทย เสียง ภาพ และคำบรรยายทำงานครบ
          EOF

          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=black:s=640x360:r=30:d=5" \
            -f lavfi -i "sine=frequency=220:sample_rate=48000:duration=5" \
            -i adult-female.mp3 \
            -filter_complex "[1:a]volume=0.12[bg];[2:a]aresample=48000,loudnorm=I=-16:TP=-1.5:LRA=7[voice];[bg][voice]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95[aout]" \
            -map 0:v:0 -map '[aout]' \
            -vf "subtitles=thai-smoke.srt:force_style='FontName=Noto Sans Thai,FontSize=28,Alignment=2,MarginV=36,BorderStyle=3,Outline=1,Shadow=0'" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 160k -t 5 thai-smoke.mp4

      - name: Verify MP4 has video and audio
        run: |
          test -s thai-smoke.mp4
          VIDEO_CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 thai-smoke.mp4)"
          AUDIO_CODEC="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 thai-smoke.mp4)"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 thai-smoke.mp4)"
          echo "video=$VIDEO_CODEC audio=$AUDIO_CODEC duration=$DURATION"
          test -n "$VIDEO_CODEC"
          test -n "$AUDIO_CODEC"
          python - <<'PY'
          import subprocess
          duration = float(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1','thai-smoke.mp4'
          ], text=True).strip())
          assert 4.5 <= duration <= 5.5, duration
          PY
