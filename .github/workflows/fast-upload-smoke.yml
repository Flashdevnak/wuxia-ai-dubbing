name: Fast Upload Runtime Smoke

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Backend"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/fast-upload-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-upload-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      WORKER_URL: https://wuxia-ai-dubbing.26nak-testdev.workers.dev
      ACCESS_KEY: ${{ secrets.WUXIA_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check upload accelerator syntax
        run: |
          node --check public/upload-fast.js
          node --check public/mobile-upload-recovery.js
          node --check src/worker-fast.js
      - name: Install smoke dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Verify runtime and concurrent multipart upload
        run: |
          python - <<'PY'
          import concurrent.futures
          import os
          import re
          import time
          import requests

          base = os.environ['WORKER_URL'].rstrip('/')
          access = os.environ['ACCESS_KEY']
          headers = {'x-access-key': access}

          health = requests.get(base + '/api/health', timeout=30).json()
          assert health.get('ok') is True, health
          assert health.get('uploadAcceleration') == 'parallel-multipart-v2', health
          assert int(health.get('uploadConcurrencyMax') or 0) == 4, health
          assert health.get('uploadResume') is True, health
          assert health.get('videoAndSeparateAudioParallel') is True, health
          assert health.get('mobileForegroundRecovery') is True, health
          assert health.get('mobileForegroundRecoveryVersion') == 'foreground-watchdog-v3', health
          assert health.get('mobileBackgroundUpload') is True, health
          assert health.get('mobileBackgroundUploadMode') == 'best-effort-v3', health
          assert int(health.get('mobileForegroundStallMs') or 0) == 8000, health
          assert int(health.get('mobileUploadHardTimeoutMs') or 0) == 120000, health

          html = requests.get(base + '/', timeout=30).text
          assert 'upload-fast.js' in html, 'upload-fast V2 runtime asset missing from HTML'
          assert 'mobile-upload-recovery.js' in html, 'foreground watchdog V3 runtime asset missing from HTML'
          assert 'studio-v2.js' in html, 'Studio V2 runtime asset missing from HTML'
          assert not re.findall(r'(?:src|href)=["\'][^"\']+\?v=', html), 'versioned asset URLs must not be served'

          asset = requests.get(base + '/upload-fast.js', timeout=30).text
          for marker in (
              'parallel-v2',
              'parallelUpload',
              'foreground-stall-watchdog-v3',
              'FOREGROUND_STALL_MS = 8000',
              'HARD_XHR_TIMEOUT_MS = 120000',
          ):
              assert marker in asset, f'missing upload accelerator marker: {marker}'
          assert 'xhr.timeout = 300000' not in asset, 'old five-minute XHR timeout is still deployed'

          recovery = requests.get(base + '/mobile-upload-recovery.js', timeout=30).text
          for marker in (
              'foreground-watchdog-v3',
              'STALE_FOREGROUND_MS = 6500',
              'MAX_PROBES = 8',
              'recoverAfterForeground',
              'meta.xhr.abort()',
          ):
              assert marker in recovery, f'missing foreground recovery marker: {marker}'

          started = requests.post(base + '/api/uploads/start', headers=headers, json={
              'name': '__parallel_upload_smoke_v3__.bin',
              'size': 9 * 1024 * 1024,
              'type': 'application/octet-stream',
          }, timeout=30).json()
          key = started['key']
          upload_id = started['uploadId']
          part_size = int(started['partSize'])
          total_size = 9 * 1024 * 1024
          first_size = min(part_size, total_size)
          second_size = total_size - first_size
          assert first_size > 0 and second_size > 0, (part_size, total_size)

          chunks = [
              (1, b'A' * first_size),
              (2, b'B' * second_size),
          ]

          def send(item):
              part_number, payload = item
              files = {'chunk': (f'part-{part_number:05d}.bin', payload, 'application/octet-stream')}
              data = {'key': key, 'uploadId': upload_id, 'partNumber': str(part_number)}
              response = requests.post(base + '/api/uploads/chunk', headers=headers, data=data, files=files, timeout=120)
              response.raise_for_status()
              body = response.json()
              assert int(body.get('partNumber') or 0) == part_number, body
              return len(payload)

          try:
              t0 = time.time()
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  uploaded = sum(pool.map(send, chunks))
              elapsed = max(0.001, time.time() - t0)
              assert uploaded == total_size, uploaded

              done = requests.post(base + '/api/uploads/complete', headers=headers, json={
                  'key': key,
                  'uploadId': upload_id,
              }, timeout=60)
              done.raise_for_status()
              body = done.json()
              assert int(body.get('size') or 0) == total_size, body

              rate = uploaded / elapsed / (1024 * 1024)
              print(f'FAST_UPLOAD_RUNTIME_V3_PASS parallel=2 bytes={uploaded} elapsed={elapsed:.2f}s rate={rate:.2f}MiB/s')
          finally:
              deleted = requests.delete(base + '/api/files', headers=headers, params={'key': key}, timeout=30)
              if deleted.ok:
                  assert deleted.json().get('ok') is True
          PY
