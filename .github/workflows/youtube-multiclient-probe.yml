name: Probe YouTube Multi Client

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-multiclient-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe caption-capable clients
        run: python scripts/probe_youtube_clients.py
