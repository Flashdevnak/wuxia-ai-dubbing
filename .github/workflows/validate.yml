name: Validate web project

on:
  push:
    branches: [main, codex/full-auto-dubbing-v1, codex/r3-runtime-integration, codex/separate-audio-human-ui, codex/parallel-upload-acceleration, codex/mobile-background-upload-v2, codex/separate-audio-pair-fix, codex/mobile-upload-stall-watchdog-v3, codex/studio-ui-rebuild-v2, codex/studio-v2-upload-v4b]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: JavaScript syntax check
        run: |
          node --check public/app.js
          node --check public/safety.js
          node --check public/full-auto.js
          node --check public/r3-studio.js
          node --check public/studio-ui.js
          node --check public/studio-v2.js
          node --check public/upload-engine-v4.js
          node --check public/pair-recovery.js
          node --check public/pair-retry-v2.js
          node --check src/worker.js
          node --check src/worker-safe.js
          node --check src/worker-full.js
          node --check src/worker-r3.js
          node --check src/worker-fast.js
          node --check src/worker-pairfix.js
          node --check src/worker-stability.js
          node --check src/worker-separate-audio-dispatch.js
          node --check src/worker-translation-integrity.js
          node --check src/storage.js
          node --check src/youtube.js

      - name: Studio V2 UX contract
        run: |
          test -f public/studio-v2.js
          test -f public/studio-v2.css
          grep -q "สร้างงานพากย์ไทย" public/index.html
          grep -q "projectSlot" public/index.html
          grep -q "toastHost" public/index.html
          grep -q "phase-strip" public/studio-v2.css
          grep -q "clearProjectIdentity" public/studio-v2.js
          grep -q "setDefaultMode" public/studio-v2.js
          grep -q "decorateAllJobs" public/studio-v2.js
          grep -q "studio-v2.js" public/index.html
          if grep -Eq '(src|href)="[^\"]+\?v=' public/index.html; then
            echo "Studio HTML still contains version query parameters" >&2
            exit 1
          fi

      - name: Resilient Mobile Upload V4 contract
        run: |
          test -f public/upload-engine-v4.js
          test -f src/worker-stability.js
          test -f src/worker-separate-audio-dispatch.js
          test -f src/worker-translation-integrity.js
          grep -q "resilient-multipart-v4" public/upload-engine-v4.js
          grep -q "adaptive-mobile-v4" public/upload-engine-v4.js
          grep -q "NORMAL_STALL_MS = 18000" public/upload-engine-v4.js
          grep -q "RETURN_STALL_MS = 26000" public/upload-engine-v4.js
          grep -q "RESPONSE_STALL_MS = 45000" public/upload-engine-v4.js
          grep -q "MAX_ATTEMPTS = 12" public/upload-engine-v4.js
          grep -q "reconcile(" public/upload-engine-v4.js
          grep -q "findCompleted(" public/upload-engine-v4.js
          grep -q "versionQueryRequired: false" src/worker-stability.js
          grep -q "upload-fast\\.js" src/worker-stability.js
          grep -q "mobile-upload-recovery\\.js" src/worker-stability.js
          grep -q "./worker-separate-audio-dispatch.js" src/worker-translation-integrity.js
          grep -q '"main": "src/worker-translation-integrity.js"' wrangler.jsonc

      - name: Separate Audio Pair Recovery contract
        run: node scripts/test_pair_recovery.mjs

      - name: Python syntax check
        run: |
          python -m py_compile \
            scripts/worker_client.py \
            scripts/media_pair.py \
            scripts/prepare_job.py \
            scripts/prepare_job_full.py \
            scripts/test_prepare_audio_guard.py \
            scripts/test_media_pair.py \
            scripts/dub_chunk.py \
            scripts/dub_guard.py \
            scripts/dub_guard_integrity.py \
            scripts/r3_studio.py \
            scripts/test_r3_studio.py \
            scripts/voice_profiles.py \
            scripts/extract_transcript_job.py \
            scripts/youtube_transcript.py \
            scripts/finalize_job.py

      - name: Run R3 engine acceptance
        working-directory: scripts
        run: python test_r3_studio.py

      - name: Ensure ffmpeg for separate-audio acceptance
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Reject uploaded video-only sources before dubbing
        working-directory: scripts
        run: |
          pip install requests
          python test_prepare_audio_guard.py

      - name: Run real video plus separate-audio acceptance
        working-directory: scripts
        run: python test_media_pair.py

      - name: Verify full automatic R3 contract
        run: |
          test -f public/index.html
          test -f public/app.js
          test -f public/safety.js
          test -f public/r3-studio.js
          test -f public/r3-studio.css
          test -f public/studio-ui.js
          test -f public/studio-ui.css
          test -f public/studio-v2.js
          test -f public/studio-v2.css
          test -f public/upload-engine-v4.js
          test -f public/pair-recovery.js
          test -f public/pair-retry-v2.js
          test -f src/worker.js
          test -f src/worker-safe.js
          test -f src/worker-full.js
          test -f src/worker-r3.js
          test -f src/worker-fast.js
          test -f src/worker-pairfix.js
          test -f src/worker-stability.js
          test -f src/worker-separate-audio-dispatch.js
          test -f src/worker-translation-integrity.js
          test -f src/storage.js
          test -f src/youtube.js
          test -f wrangler.jsonc
          test -f requirements.txt
          test -f scripts/media_pair.py
          test -f scripts/test_prepare_audio_guard.py
          test -f scripts/test_media_pair.py
          test -f scripts/test_pair_recovery.mjs
          test -f scripts/dub_guard.py
          test -f scripts/dub_guard_integrity.py
          test -f scripts/r3_studio.py
          test -f scripts/voice_profiles.py
          test -f scripts/prepare_job_full.py
          test -f .github/workflows/dubbing.yml
          test -f .github/workflows/transcript.yml
          test -f .github/workflows/thai-media-smoke.yml
          test -f .github/workflows/deploy-cloudflare.yml
          grep -q "python scripts/dub_guard_integrity.py" .github/workflows/dubbing.yml
          grep -q "python scripts/prepare_job_full.py" .github/workflows/dubbing.yml
          grep -q "Noto Sans Thai" .github/workflows/dubbing.yml
          grep -q "AUDIO_PROFILE_VERSION = 6" scripts/dub_guard.py
          grep -q "TRANSLATION_INTEGRITY_PROFILE = 7" scripts/dub_guard_integrity.py
          grep -q "Translation Integrity Gate ไม่ผ่าน" scripts/dub_guard_integrity.py
          grep -q "R3 Quality Gate" scripts/dub_guard.py
          grep -q "translation cache HIT" scripts/dub_guard.py
          grep -q "auto-cast" scripts/voice_profiles.py
          grep -q "youtube-auto-hybrid" scripts/prepare_job_full.py
          grep -q "ไฟล์วิดีโอนี้ไม่มีเสียง (video-only)" scripts/prepare_job.py
          grep -q "sourceStreamsVerified" scripts/prepare_job.py
          grep -q "PREPARE_AUDIO_GUARD_ACCEPTANCE_PASS" scripts/test_prepare_audio_guard.py
          grep -q "sourceAudioKey" scripts/prepare_job_full.py
          grep -q "paired_source.mkv" scripts/prepare_job_full.py
          grep -q "1:a:0" scripts/media_pair.py
          grep -q "MEDIA_PAIR_ACCEPTANCE_PASS" scripts/test_media_pair.py
          grep -q "ระบบไม่ส่งออกไฟล์ไทยที่ผิดภาษา" scripts/extract_transcript_job.py
          grep -q '"main": "src/worker-translation-integrity.js"' wrangler.jsonc
          grep -q "./worker-separate-audio-dispatch.js" src/worker-translation-integrity.js
          grep -q '"binding": "MEDIA_BUCKET"' wrangler.jsonc
          grep -q '"*/10 \* \* \* \*"' wrangler.jsonc
          grep -q "r3SmartStudio" src/worker-r3.js
          grep -q "sourceAudioKey" src/worker-r3.js
          grep -q "separateAudioInput" src/worker-r3.js
          grep -q "humanStudioUi" src/worker-r3.js
          grep -q "jobSourceKeys" src/worker-full.js
          grep -q "/api/r3/batch" src/worker-r3.js
          grep -q "repair" src/worker-r3.js
          grep -q "download-ticket" src/worker-safe.js
          grep -q "temporary-cleanup" src/worker-full.js
          grep -q "separateAudioPairRecovery" src/worker-pairfix.js
          grep -q "pair-recovery.js" src/worker-pairfix.js
          grep -q "sourceAudioKey" public/pair-recovery.js
          grep -q "sourceAudioKey" src/worker-separate-audio-dispatch.js
          grep -q "separateAudioPersistBeforeDispatch" src/worker-separate-audio-dispatch.js
          grep -q "pair-retry-v2.js" src/worker-separate-audio-dispatch.js
          grep -q "uploadServerReconcile: true" src/worker-stability.js
          if grep -q "oauth2.googleapis.com" src/storage.js; then
            echo "Permanent Google Drive OAuth dependency is still present in storage.js" >&2
            exit 1
          fi

      - name: Cloudflare Worker bundle dry-run
        run: |
          npm install
          npx wrangler deploy --dry-run --outdir .wrangler-dry
