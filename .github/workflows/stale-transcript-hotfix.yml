name: Apply Stale Transcript Queue Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stale-transcript-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://wuxia-ai-dubbing.26nak-testdev.workers.dev
    steps:
      - uses: actions/checkout@v6

      - name: Patch stale transcript handling
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('src/worker.js')
          text = p.read_text(encoding='utf-8')

          old = "  if (p === '/api/jobs' && request.method === 'GET') return json({ jobs: await listJobs(env) });"
          new = """  if (p === '/api/jobs' && request.method === 'GET') {
            const jobs = await listJobs(env);
            const now = Date.now();
            for (const job of jobs) {
              if (job.jobType !== 'transcript' || job.status !== 'queued' || job.runId) continue;
              const queuedAt = Date.parse(job.updatedAt || job.createdAt || '');
              if (!Number.isFinite(queuedAt) || now - queuedAt < 10 * 60 * 1000) continue;
              job.status = 'failed';
              job.stage = 'เริ่มงานดึงคำบรรยายไม่สำเร็จ';
              job.error = 'งานดึงคำบรรยายไม่เริ่มทำงานภายในเวลาที่กำหนด กรุณากดลองใหม่';
              job.progress = Math.max(3, cleanProgress(job.progress));
              await writeJob(env, job);
            }
            return json({ jobs });
          }"""
          if old not in text:
              raise SystemExit('GET /api/jobs patch target not found')
          text = text.replace(old, new, 1)

          pattern = re.compile(
              r"    if \(!dispatch\.triggered\) \{\n"
              r"\s+job\.stage = 'ยังเริ่มประมวลผลไม่ได้';\n"
              r"\s+job\.error = dispatch\.detail \|\| dispatch\.reason \|\| null;\n"
              r"\s+await writeJob\(env, job\);\n"
              r"\s+\}"
          )
          replacement = """    if (!dispatch.triggered) {
              job.status = 'failed';
              job.stage = job.jobType === 'transcript' ? 'เริ่มงานดึงคำบรรยายไม่สำเร็จ' : 'ยังเริ่มประมวลผลไม่ได้';
              job.error = dispatch.detail || dispatch.reason || 'ไม่สามารถส่งงานไปประมวลผลได้';
              await writeJob(env, job);
            }"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'dispatch failure patch target count={count}')

          p.write_text(text, encoding='utf-8')
          print('stale transcript handling patched')
          PY

      - name: Validate Worker syntax
        run: node --check src/worker.js

      - name: Commit permanent source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js
          git commit -m "Fail stale transcript jobs instead of hanging"
          git push origin main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Deploy Worker
        run: |
          npm install
          npx wrangler deploy

      - name: Verify production Worker
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(os.environ['WORKER_URL'] + '/api/health', headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=120) as r:
              health = json.load(r)
          assert health.get('driveReady') is True, health
          print('production Worker healthy')
          PY
