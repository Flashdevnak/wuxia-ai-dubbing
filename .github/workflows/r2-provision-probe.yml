name: R2 Provision Probe

on:
  push:
    branches: [codex/r2-storage-failover-v1]
    paths:
      - '.github/workflows/r2-provision-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: wuxia-ai-dubbing-files
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Diagnose R2 access and ensure bucket exists
        shell: bash
        run: |
          set -uo pipefail
          echo "Wrangler: $(npx wrangler --version 2>&1 | tail -1)"
          echo "Account configured: $([ -n \"${CLOUDFLARE_ACCOUNT_ID:-}\" ] && echo yes || echo no)"
          echo "Token configured: $([ -n \"${CLOUDFLARE_API_TOKEN:-}\" ] && echo yes || echo no)"
          echo "--- R2 bucket list ---"
          LIST="$(npx wrangler r2 bucket list 2>&1)"
          LIST_RC=$?
          printf '%s\n' "$LIST"
          echo "list_rc=$LIST_RC"
          if [ "$LIST_RC" -ne 0 ]; then
            echo "R2_LIST_FAILED=1" >> "$GITHUB_ENV"
            exit "$LIST_RC"
          fi
          if printf '%s\n' "$LIST" | grep -Fq "$BUCKET"; then
            echo "R2 bucket already exists: $BUCKET"
          else
            echo "--- creating $BUCKET ---"
            CREATE="$(npx wrangler r2 bucket create "$BUCKET" 2>&1)"
            CREATE_RC=$?
            printf '%s\n' "$CREATE"
            echo "create_rc=$CREATE_RC"
            exit "$CREATE_RC"
          fi
      - name: Verify R2 bucket
        run: |
          npx wrangler r2 bucket list | tee /tmp/r2-list.txt
          grep -Fq "$BUCKET" /tmp/r2-list.txt
