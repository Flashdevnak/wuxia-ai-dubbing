name: Deploy storage cleanup controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-storage-controls.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://wuxia-ai-dubbing.26nak-testdev.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Protect active jobs from destructive cleanup
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/worker.js')
          s = p.read_text(encoding='utf-8')
          old = """  if (cleanup && request.method === 'POST') {\n    const kind = cleanup[1];\n    const prefixes = kind === 'all'\n"""
          new = """  if (cleanup && request.method === 'POST') {\n    const kind = cleanup[1];\n    if (kind !== 'outputs') {\n      const jobs = await listJobs(env);\n      const active = jobs.filter(job => ['queued', 'processing', 'paused'].includes(String(job.status || '')));\n      if (active.length) {\n        return json({\n          error: 'ยังมีงานที่กำลังทำหรือหยุดชั่วคราวอยู่ กรุณาให้งานเสร็จหรือลบงานก่อน',\n          activeJobs: active.length,\n        }, 409);\n      }\n    }\n    const prefixes = kind === 'all'\n"""
          if old not in s:
              raise SystemExit('cleanup block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

      - name: Validate current main
        run: |
          node --check public/app.js
          node --check src/worker.js
          grep -q "cleanupUploadsBtn" public/index.html
          grep -q "cleanupOutputsBtn" public/index.html
          grep -q "cleanupAllBtn" public/index.html
          grep -q "activeJobs" src/worker.js

      - name: Install Wrangler
        run: npm install

      - name: Deploy current main to Cloudflare
        run: npx wrangler deploy

      - name: Verify live storage controls
        run: |
          python - <<'PY'
          import os, time, urllib.request
          base = os.environ['WORKER_URL'].rstrip('/')
          last = ''
          for attempt in range(1, 9):
              try:
                  req = urllib.request.Request(base + '/?storage_controls=' + str(attempt), headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  html = urllib.request.urlopen(req, timeout=60).read().decode('utf-8', 'replace')
                  last = html[:400]
                  if all(x in html for x in ['cleanupUploadsBtn','cleanupOutputsBtn','cleanupAllBtn']):
                      health = urllib.request.urlopen(urllib.request.Request(base + '/api/health?storage_controls=' + str(attempt), headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}), timeout=60).read().decode()
                      assert '"ok":true' in health
                      print('live storage controls: OK')
                      break
              except Exception as exc:
                  last = repr(exc)
              if attempt == 8:
                  raise AssertionError('live assets did not propagate: ' + last)
              time.sleep(5)
          PY

      - name: Commit guard and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/deploy-storage-controls.yml
          git add src/worker.js .github/workflows/deploy-storage-controls.yml
          git commit -m "Protect active jobs during storage cleanup"
          git push
